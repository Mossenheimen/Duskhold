# Talents (CONCEPT.md, levelling): each level from 2 offers three of your class's (classes.toml)
# that you haven't taken, and you pick one. Each reads in one line and is a thing you'd notice:
# no one-point picks. Multipliers are 1.0 for none; hit, knock_down and struggle are chances added.

[[talent]]
id = "tough"
name = "Tough"
line = "15 more health"
health = 15

[[talent]]
id = "tireless"
name = "Tireless"
line = "running, swings and struggles cost a quarter less breath"
endurance = 0.75

[[talent]]
id = "second_wind"
name = "Second Wind"
line = "once between sleeps, catch your breath: endurance full, and 10 health back (C)"
second_wind = true

[[talent]]
id = "cleave"
name = "Cleave"
line = "a blow that puts one down carries on into another beside you"
cleave = true

[[talent]]
id = "shrug"
name = "Shrug"
line = "struggling free works more often, and it takes one more of them to drag you down"
struggle = 0.2
hold = 1

[[talent]]
id = "bash"
name = "Bash"
line = "your shoves knock down far more often"
knock_down = 0.35

[[talent]]
id = "doorwarden"
name = "Doorwarden"
line = "beside a door, your blows land more often and the dead get hold of you less"
doorway = true
hit = 0.15
grabbed = 0.5

[[talent]]
id = "heavy_hand"
name = "Heavy Hand"
line = "a quarter more harm with blunt weapons"
skill = "blunt"
damage = 1.25

[[talent]]
id = "edge"
name = "Edge"
line = "a quarter more harm with blades"
skill = "blade"
damage = 1.25

[[talent]]
id = "woodsman"
name = "Woodsman"
line = "a quarter more harm with axes"
skill = "axe"
damage = 1.25

# The Cleric's (rules.toml's [faith]). faith: points it adds; mending and warding: verbs of faith;
# steady: how fast dread rises with a light held up; turn_time and turn_reach: how long and how far
# the dead are turned; sunder: the dead turned with this much health or less fall instead.

[[talent]]
id = "devout"
name = "Devout"
line = "25 more faith"
faith = 25

[[talent]]
id = "mending"
name = "Mending"
line = "spend faith to stop your worst bleeding wound and get 15 health back (M)"
mending = true

[[talent]]
id = "purify"
name = "Purify"
line = "a prayer at a shrine cures ghoul fever too"
purify = true

[[talent]]
id = "warding"
name = "Warding"
line = "spend faith to ward the shut door beside you: the dead won't beat on it for a night (O)"
warding = true

[[talent]]
id = "steady"
name = "Steady"
line = "with a light held up, your dread rises half as fast"
steady = 0.5

[[talent]]
id = "rebuke"
name = "Rebuke"
line = "the dead you turn flee twice as long, and from 4 tiles farther off"
turn_time = 2.0
turn_reach = 4

[[talent]]
id = "sunder"
name = "Sunder"
line = "the dead you turn with 15 health or less fall instead"
sunder = 15

[[talent]]
id = "last_rites"
name = "Last Rites"
line = "the dead you put down stay down"
last_rites = true
