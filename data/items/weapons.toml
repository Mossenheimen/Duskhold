# Weapons. Each brings its own swing: wind-up and recovery in seconds (the wind-up is the tell the
# dead see), endurance and damage in points (a shambler has 30 health), the chance a blow lands,
# and its noise in tiles. wear: the condition (out of 100) it loses with every blow that lands; at
# 0 it breaks. skill: the skill it trains and uses (blade, blunt, axe or spear; rules.toml's
# [skills]). Nothing in hand, you swing as rules.toml's [attack] says: bare hands.
#
# Noise is a real property: a wall takes 4 tiles off a sound (rules.toml, [sound]). A knife's 3
# stays in the room; a cudgel's 6 is heard next door; a wood axe's 9 two rooms off, and by
# anything with its back to you in the street. The dead see 8 tiles, in front of them only.

[[item]]
id = "cudgel"
name = "cudgel"
weight = 1.5          # kg
worth = 4
weapon = { wind_up = 0.4, recovery = 0.6, endurance = 9, hit = 0.85, damage = [8, 12], noise = 6, wear = 1.0, skill = "blunt" }

