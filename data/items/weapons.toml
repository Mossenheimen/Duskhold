# Shields, on the off arm where a light would be (shield.rs in the core): block is the chance a blow
# from ahead is blocked while you brace (the right mouse button, held), endurance the breath a block costs, wear what a block
# takes off it (out of 100), bash what it adds to a shove's chance to knock down.

