# Bags (bag.rs in the core): worn on the back, one at a time. With no bag you carry what fits in
# your pockets (rules.toml's [character] pockets, a grid of cells). A bag's grid is its own, so many
# cells across and down beside your pockets' (pack.rs: what fits is what you carry), and what's in
# it weighs `lighter` less on you, so a good pack carries a load you could still run with. Reaching
# into one is slower than reaching into your pockets (rules.toml's [items] from_bag). Dropped, a
# bag falls with everything in it, and taken up again it goes back on with all of it, where it lay.
# size: the cells it takes up itself, carried and not worn.

[[item]]
id = "satchel"
name = "satchel"
weight = 0.5
size = [2, 2]
bag = { grid = [4, 4], lighter = 0.25 }
worth = 2

[[item]]
id = "knapsack"
name = "knapsack"
weight = 1.0
size = [2, 3]
bag = { grid = [6, 4], lighter = 0.4 }
worth = 4

[[item]]
id = "grain_sack"
name = "grain sack"
weight = 0.4
size = [2, 3]
bag = { grid = [6, 5], lighter = 0.0 }   # holds plenty, and carries it badly
worth = 1

[[item]]
id = "travellers_pack"
name = "traveller's pack"
weight = 1.8
size = [2, 3]
bag = { grid = [8, 5], lighter = 0.5 }   # a pack frame: only ever off one of the rares; with your pockets, Path of Exile's twelve by five
worth = 10
