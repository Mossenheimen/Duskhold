# Supplies. weight in kg for one; stack: how many make one stack. A bandage goes on the worst
# wound that's bleeding and stops it (time: seconds to put on). Food takes hunger away and drink
# thirst (out of 100: rules.toml's [hunger] and [thirst]). A light is held up lit in your other
# hand: it lights the tiles round it, and burns down until it goes out (rules.toml, [day]).
# The cure takes ghoul fever away at any stage (rules.toml, [fever]).

[[item]]
id = "bandage"
name = "bandage"
weight = 0.1
worth = 3
stack = 10
bandage = { time = 2.0 }

[[item]]
id = "rag"
name = "rag"
weight = 0.1
worth = 1
stack = 10
bandage = { time = 3.5 }   # slower to tie than a bandage

[[item]]
id = "tincture"
name = "feverfew tincture"
weight = 0.1
worth = 15            # bring one home, and know where it is
stack = 5
cure = { time = 3.0 }

[[item]]
id = "lamp_oil"
name = "flask of lamp oil"
weight = 0.5
worth = 2             # better poured on the dead than banked
stack = 4
oil = true            # poured on a body and set alight, it burns it, and it won't get up (rules.toml, [burning])

[[item]]
id = "bread"
name = "loaf of bread"
weight = 0.5
worth = 2
stack = 4
food = { nutrition = 40, time = 4.0 }   # hunger it takes away, seconds to eat

[[item]]
id = "apple"
name = "apple"
weight = 0.15
worth = 1
stack = 10
food = { nutrition = 10, time = 1.5 }

[[item]]
id = "jerky"
name = "dried meat"
weight = 0.1
worth = 2
stack = 10
food = { nutrition = 20, time = 2.5 }

[[item]]
id = "water"
name = "bottle of water"
weight = 0.6
worth = 2
stack = 4
drink = { water = 40, time = 2.0 }    # thirst it takes away, seconds to drink

[[item]]
id = "torch"
name = "torch"
weight = 0.6
worth = 2
stack = 5
light = { radius = 7, burn = 1.0 }   # tiles it lights (you see about 6 by it), game hours it burns

[[item]]
id = "candle"
name = "candle"
weight = 0.1
worth = 1
stack = 10
light = { radius = 3, burn = 4.0 }

[[item]]
id = "nails"
name = "nails"
weight = 0.01         # one nail; a board takes two (rules.toml's [barricade])
worth = 0.05
stack = 100

[[item]]
id = "plank"
name = "plank"
weight = 2.0
worth = 1
stack = 5

[[item]]
id = "coins"
name = "coins"
weight = 0.01
worth = 1
stack = 100

