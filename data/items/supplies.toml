# Supplies. weight in kg for one; stack: how many make one stack. A bandage goes on the worst
# wound that's bleeding and stops it (time: seconds to put on). Food takes hunger away and drink
# thirst (out of 100: rules.toml's [hunger] and [thirst]).

[[item]]
id = "bandage"
name = "bandage"
weight = 0.1
stack = 10
bandage = { time = 2.0 }

[[item]]
