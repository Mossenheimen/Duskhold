# What you can make from what you carry (the crafting panel, T). makes: the item, and count how
# many (1 if left out); uses: what it uses up, by item and how many (from your pack first, then
# your hand); tools: any one of them to hand, kept (none if left out); time: seconds; skill and
# xp: what it teaches (rules.toml's [skills.xp] for the scale). What you make is yours, not a find:
# it brings no XP home. Carpentry makes its own recipes quicker, as it does boarding up.

[[recipe]]
id = "torch"          # a split log, its end bound in a rag: an hour's light
makes = "torch"
uses = { firewood = 1, rag = 1 }
time = 4.0

# Cooking: made only beside a lit hearth, stove or forge (fire = true). Cooking, the skill, makes
# it quicker. Cooked food fills you more than raw, eases dread, and keeps longer.

[[recipe]]
id = "roast_mutton"   # a joint over the fire
makes = "roast_mutton"
uses = { raw_mutton = 1 }
fire = true
time = 20.0
skill = "cooking"
xp = 1.0

