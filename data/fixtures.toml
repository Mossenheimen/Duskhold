# What can stand on a tile. solid: nobody walks through it. opaque: nobody sees through it.
# A tile's fixture number is its place in this list, from 1. The client draws each by its id.
# loot: it's a container, filled from that loot table (loot/*.toml). bed: you sleep best beside one.

[[fixture]]
id = "tree"
solid = true
opaque = true

[[fixture]]
id = "bed"
solid = true
bed = true

[[fixture]]
id = "wardrobe"
solid = true
opaque = true
loot = "bedroom"

[[fixture]]
id = "cupboard"
solid = true
loot = "kitchen"

[[fixture]]
id = "table"
solid = true

[[fixture]]
id = "chair"
solid = true

[[fixture]]
id = "stove"
solid = true

[[fixture]]
id = "crate"
solid = true
loot = "shed"

[[fixture]]
id = "barrel"
solid = true
loot = "stores"

[[fixture]]
id = "shelf"
solid = true
opaque = true
loot = "shelf"

[[fixture]]
id = "pew"
solid = true

[[fixture]]
id = "altar"
solid = true

[[fixture]]
id = "counter"
solid = true
trade = "abbey"       # a holdout trades over it (holdouts.toml)

[[fixture]]
id = "sister"         # the one who keeps the counter (a holdout's people come later)
solid = true
