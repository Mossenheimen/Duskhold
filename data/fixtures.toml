# What can stand on a tile. solid: nobody walks through it. opaque: nobody sees through it.
# A tile's fixture number is its place in this list, from 1. The client draws each by its id.
# loot: it's a container, filled from that loot table (loot/*.toml). bed: you sleep best beside one.
# fire: it takes a fire (a hearth, a stove, a forge: rules.toml's [fire]), which lights this many
# tiles round it. Each keeps a few logs by it. planks: it breaks down into so many (with a hammer or
# an axe: rules.toml's [crafting]); a container never does. shrine: you pray at it (rules.toml's
# [faith]).

[[fixture]]
id = "tree"
solid = true
opaque = true

[[fixture]]
id = "bed"
solid = true
bed = true
planks = 2

[[fixture]]
id = "wardrobe"
solid = true
opaque = true
loot = "bedroom"

[[fixture]]
id = "cupboard"
solid = true
loot = "kitchen"

[[fixture]]
id = "table"
solid = true
planks = 2

[[fixture]]
id = "chair"
solid = true
planks = 1

[[fixture]]
id = "stove"
solid = true
fire = 5              # an iron range: less light than an open hearth
loot = "logs"

[[fixture]]
id = "crate"
solid = true
loot = "shed"

[[fixture]]
id = "barrel"
solid = true
loot = "stores"

[[fixture]]
id = "shelf"
solid = true
opaque = true
loot = "shelf"

[[fixture]]
id = "pew"
solid = true
planks = 2

[[fixture]]
id = "altar"
solid = true
shrine = true

[[fixture]]
id = "counter"
solid = true
trade = "abbey"       # a holdout trades over it (holdouts.toml)

[[fixture]]
id = "sister"         # the one who keeps the counter (a holdout's people come later)
solid = true

# The market town's shops (prefabs/town.toml), each with its own loot (loot/town.toml).

[[fixture]]
id = "forge"          # the smith's forge, gone cold
solid = true
fire = 6
loot = "logs"

[[fixture]]
id = "anvil"
solid = true
loot = "anvil"        # the smith's last work, left on it: armour

[[fixture]]
id = "rack"           # a weapon rack: the smith's work
solid = true
loot = "smithy"

[[fixture]]
id = "till"           # a shop's counter, with the till in it
solid = true
loot = "till"

[[fixture]]
id = "shop_shelf"     # a general store's shelves of goods
solid = true
opaque = true
loot = "store"

[[fixture]]
id = "bar"            # the tavern's bar
solid = true
loot = "bar"

[[fixture]]
id = "cask"
solid = true
loot = "cellar"

[[fixture]]
id = "hearth"         # a stone hearth, cold till someone lights it
solid = true
fire = 6
loot = "logs"

# The farms' (prefabs/farm.toml). water: you can drink from it, as from a pond.

[[fixture]]
id = "wheat"          # tall wheat, never harvested: you walk through it, but nobody sees through it
opaque = true

[[fixture]]
id = "well"
solid = true
water = true

[[fixture]]
id = "sack"           # sacks of the harvest
solid = true
loot = "harvest"

[[fixture]]
id = "hay"            # bales
solid = true

[[fixture]]
id = "tools"          # a rack of farm tools
solid = true
loot = "farm"

# The graveyard's (prefabs/graveyard.toml).

[[fixture]]
id = "grave"          # a headstone over a grave
solid = true

[[fixture]]
id = "tomb"           # an old stone tomb, its grave goods within
solid = true
loot = "tomb"

# The chapel's (prefabs/hamlet.toml).

[[fixture]]
id = "font"           # a stone font by the chapel door, its holy water stoppered in flasks
solid = true
loot = "font"

# Wild plants (crates/dusk-core/src/forage.rs; regions/*.toml's [plants], and a prefab's grows):
# walked through and seen past. forage: the item picked from it (E), how many (the fewest and the
# most), and the game days before it grows back; picked, it's a picked_plant till then
# (rules.toml's [foraging]).

[[fixture]]
id = "yarrow"         # in the open: feathery leaves and flat white flower heads; it staunches wounds
forage = { item = "yarrow", count = [1, 2], regrow = 3.0 }

[[fixture]]
id = "chamomile"      # by the water: small daisies that smell of apples, and calm
forage = { item = "chamomile", count = [1, 3], regrow = 3.0 }

[[fixture]]
id = "bramble"        # in the woods: a thorny tangle, black with berries
forage = { item = "blackberries", count = [1, 3], regrow = 4.0 }

[[fixture]]
id = "feverfew"       # only where the dead lie (the barrows, the graveyard): the fever's cure
forage = { item = "feverfew", count = [1, 2], regrow = 5.0 }

[[fixture]]
id = "picked_plant"   # a plant picked bare: stalks, till it grows back
