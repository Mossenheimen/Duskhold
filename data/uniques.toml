[[unique]]
id = "abbey_door"
name = "The Abbey Door"
item = "heater_shield"
properties = ["stalwart"]
effect = { name = "Sanctuary", line = "one blow in four you block sends the dead that struck it fleeing", on = "shield", terror = 0.25 }
lore = "It kept them out once. It remembers how."
