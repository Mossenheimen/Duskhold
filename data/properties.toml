# Magic items' properties and curses (CONCEPT.md, loot): each reads in one line and changes how
# you play (crates/dusk-core/src/magic.rs). An Uncommon item has one or two, a Rare three or four
# and a made-up name (names.toml's [things]); a fifth or so are cursed as well (rules.toml,
# [magic]). A weapon's work while it's in your hand, a light's while it's held up. Multipliers are
# 1.0 for none.
#
# Tiers (Path of Exile's): most properties are one of a family's three tiers, each more than the
# last, and a thing has at most one of a family. A find rolls a tier only as far out as it was
# found (rules.toml's [magic] far): the first near where you come in, the second about the hamlet,
# the third far out; a rare's pack and an old tomb reach one further (loot/, level). A property
# with no tier is found anywhere. The card shows a tier after the name: "Keen (II)".

# Quieter swings.

[[property]]
id = "hushed"
name = "Hushed"
line = "your swings make little more than half the noise"
on = "weapon"
family = "quiet"
tier = 1
noise = 0.6

[[property]]
