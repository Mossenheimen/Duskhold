# Magic items' properties and curses (CONCEPT.md, loot): each changes how you play
# (crates/dusk-core/src/magic.rs), on a weapon, a light or armour. An Uncommon item has one or two, a Rare three or four and a
# made-up name (names.toml's [things]); a fifth or so are cursed as well (rules.toml, [magic]). A
# weapon's work while it's in your hand, a light's while it's held up. Multipliers are 1.0 for
# none.
#
# Shown as numbers (Diablo's and Path of Exile's: crates/dusk-core/src/card.rs): a property's card
# line is what it does, "+80% damage", "+2 to Strength", "Adds 3-6 fire damage". One that's more
# than numbers has a line in words instead (Hallowed, Blazing).
#
# Tiers (Path of Exile's): most properties are one of a family's three tiers, each more than the
# last, and a thing has at most one of a family. A find rolls a tier only as far out as it was
# found (rules.toml's [magic] far): the first near where you come in, the second about the hamlet,
# the third far out; a rare's pack and an old tomb reach one further (loot/, level). A property
# with no tier is found anywhere. The card shows its word and tier beside its numbers: "Keen II".
#
# A property is saved by its place in this file: a new one goes at the end, so a saved world's
# magic keeps its meaning.

