# The Hushlands' town houses and outbuildings, and its chapel, as text grids
# (crates/dusk-core/src/text.rs). Its shops are in town.toml; the farms, out in the fields, in
# farm.toml.
#
# Edges: - and | walls, D/d a shut/open door, W/w a shut/open window, f a fence, a space open.
# Cells come from the legend below; a space cell leaves the land as it was.
# name: what you're told when you're inside it (the id, if it has none).
# front: the side with the main door. The generator turns each building to face the road.
# tags: what the region's town asks for (regions/hushlands.toml, [hamlet] lots).
# dead (if given): how many of the dead are in it at the start, instead of the region's per_house.

[legend]
"." = { ground = "floor" }
"," = { ground = "grass" }
":" = { ground = "dirt" }
"b" = { ground = "floor", fixture = "bed" }
"a" = { ground = "floor", fixture = "wardrobe" }
"c" = { ground = "floor", fixture = "cupboard" }
"t" = { ground = "floor", fixture = "table" }
"h" = { ground = "floor", fixture = "chair" }
"s" = { ground = "floor", fixture = "stove" }
"k" = { ground = "floor", fixture = "crate" }
"r" = { ground = "floor", fixture = "barrel" }
"e" = { ground = "floor", fixture = "shelf" }
"p" = { ground = "floor", fixture = "pew" }
"l" = { ground = "floor", fixture = "altar" }
"o" = { ground = "floor", fixture = "font" }

[[prefab]]
id = "cottage"
name = "a cottage"
tags = ["house"]
front = "south"
grid = """
+-+-+-+-+-+-+-+
|b a|s c c . r|
+   +         +
|. .d. . . . .|
+-+-+         +
|b .d. t t h .W
+   +         +
|. .|. h . . .|
+-+-+-+W+-+d+-+
"""

