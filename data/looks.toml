# How things look (VISUALS.md §5, "The kit", and §14): the world's materials, and every fixture made
# of a few shapes in them, so the whole world looks made by one hand. The core never reads this:
# the client draws from it (DuskWorld.looks()), and dusk-data checks it.
#
# [material]: a colour ("#RRGGBB", sRGB, as picked) and a surface the shaders draw on it
# (VISUALS.md §6): plain, plaster, wood, stone, foliage, straw, cloth, iron or bark. A material is
# named "group.name". The client reads the ground's, the buildings' and world.litter by name.
#
# A look is a list of parts, or [[fixture.variant]]s of them (each tile takes one by its place).
# A part:
#   shape     box; cylinder (upright: `sides` round it, 8 if left out; `taper`, its top's width
#             over its bottom's, 0 a cone); ball (`sides` round it); prism (a ridge: a triangle
#             size.x wide and size.y high, run size.z along)
#   size      metres across (x), up (y) and deep (z)
#   at        its centre, from the look's origin: the middle of its base, +y up, its front -z
#   turn      degrees about x, y and z, as Godot turns a node (y first, then x, then z)
#   material  a [material] by name
#   mirror    "x", "z" or "xz": its mirror image too (four of it, with "xz")
#   repeat    { count = n, step = [x, y, z] }: n of it, each a step on from the last
#   cut       false: never cut away round the character (a trunk you must see whole)
# A fixture's look also says:
#   placed    "wall" (its back to a wall, a window or a fence of its own tile, if it has one; else
#             as "fixed"), "fixed" (its front south, toward the camera's side) or "loose" (turned
#             a quarter at a time and a little more, by its place)
#   faces     a fixture its front turns toward, when one's within `reach` tiles (1 if left out)
#   backs     a fixture its back turns toward, the same way
#   grow      [least, most]: how much one tile's is scaled against another's
#   vary      how far one tile's colour strays from another's, lighter or darker (0.045)
#   fire      where a fire laid in it burns (its embers): a point of the look
# The kit's rules (VISUALS.md §5): parts at least 4 cm thick, so they read at zoom 14; detail from
# parts, never painted; the world's materials quiet (VISUALS.md §4); a fixture under 500
# triangles. Every fixture in fixtures.toml has a look here; dusk-data checks it.

# The ground's kinds, by DuskWorld's ground code (ground.gdshader draws their surfaces).
[material.ground]
void = { colour = "#12141A" }
grass = { colour = "#5E6B4F" }
dirt = { colour = "#6E5940" }
road = { colour = "#857A66" }
water = { colour = "#334D61" }
floor = { colour = "#78593D" }
shallows = { colour = "#4D6B78" }
bridge = { colour = "#664A2E" }

# Walls, doors, boards nailed up and fences (chunk_view.gd draws them on the tiles' edges).
[material.build]
wall = { colour = "#A8A191", surface = "plaster" }
door = { colour = "#614026", surface = "wood" }
board = { colour = "#9E7A4D", surface = "wood" }
fence = { colour = "#73614D", surface = "wood" }

[material.world]
litter = { colour = "#9E855C", surface = "cloth" }  # a bundle dropped on a floor
soot = { colour = "#2B2724" }  # a hearth's mouth, a forge's bed of coals
earth = { colour = "#5C4A36" }  # heaped up: a grave's mound

[material.tree]
trunk = { colour = "#4D3B2B", surface = "bark" }
leaves = { colour = "#3D5436", surface = "foliage" }

# Wild plants (fixtures.toml's forage), and their flowers: bright, as what you can pick should be.
[material.plant]
yarrow = { colour = "#6B805C", surface = "foliage" }
chamomile = { colour = "#738F59", surface = "foliage" }
feverfew = { colour = "#667A4D", surface = "foliage" }
bramble = { colour = "#2B3B29", surface = "foliage" }
picked = { colour = "#756945", surface = "straw" }  # stalks, picked bare

[material.flower]
white = { colour = "#EDEDDE" }
cream = { colour = "#F5EDAD" }
yellow = { colour = "#F0E06B" }

# Furniture's woods, from the palest (new deal: crates) to the darkest (old oak: wardrobes). The
# floor's planks (ground.floor) sit between pale and oak in value, so furniture always stands off
# them: lighter, or darker.
[material.wood]
pale = { colour = "#93795A", surface = "wood" }
oak = { colour = "#5E4229", surface = "wood" }
dark = { colour = "#46301F", surface = "wood" }
weathered = { colour = "#6E6252", surface = "wood" }  # out in the weather: a well, a farm's racks

[material.stone]
pale = { colour = "#9E998F", surface = "stone" }  # dressed: the altar, the font
grey = { colour = "#858789", surface = "stone" }  # a well, a headstone
old = { colour = "#787873", surface = "stone" }  # the old tombs
dark = { colour = "#6B6661", surface = "stone" }  # a hearth
black = { colour = "#4D4542", surface = "stone" }  # a forge, sooted

[material.metal]
iron = { colour = "#38383D", surface = "iron" }
black = { colour = "#2B2B30", surface = "iron" }
steel = { colour = "#8C9196", surface = "iron" }  # an edge
bronze = { colour = "#8C7046", surface = "iron" }  # bell bronze: the Hushlands' accent (§15)

[material.cloth]
linen = { colour = "#B8AE9A", surface = "cloth" }
wool = { colour = "#94785F", surface = "cloth" }
sacking = { colour = "#998561", surface = "cloth" }
habit = { colour = "#5C6175", surface = "cloth" }  # the sisters' grey

[material.straw]
hay = { colour = "#BDA861", surface = "straw" }
wheat = { colour = "#B89E52", surface = "straw" }
twine = { colour = "#857043", surface = "straw" }

[material.clay]
red = { colour = "#8A5A44" }

[material.glass]
green = { colour = "#4F6352" }

[material.wax]
candle = { colour = "#D9CFB4" }

