# The Hushlands: grey-green fields and woods, ponds, a road, and a market town where the dead walk.
# The generator (crates/dusk-gen) makes a patch of it from a seed.

id = "hushlands"
name = "The Hushlands"

[patch]
chunks = [8, 8]       # the patch's size, in chunks of 32 × 32 tiles

[terrain]
hill_size = 40.0      # tiles across a rise in the land, roughly
pond_below = 0.27     # the land's height (0 to 1) under which there's water
woods_from = 0.58     # the dampness (0 to 1) where the woods begin
woods_thick = 0.75    # the dampness where they're at their thickest
woods_trees = 0.6     # the share of tiles with a tree where they're thickest
field_trees = 0.008   # the share of open land with a lone tree

[road]
width = 3             # tiles
bend_every = 24       # tiles between bends
sway = 8              # the most a bend strays north or south of the middle, in tiles
start = 40            # you start on the road this many tiles west of the hamlet

[hamlet]
# The market town: its lots, by prefab tag, from the middle outward on alternate sides of the
# road: north, south, north, ... At its heart the chapel (the landmark) and the tavern face each
# other across the road, with the smithy and the general store beside them (prefabs/town.toml);
# then the graveyard beside the chapel (prefabs/graveyard.toml), then houses and outbuildings. It
# lies wherever along the road leaves room west of it for the
# abbey and east of it for the river.
lots = ["landmark", "tavern", "smithy", "store", "graveyard", "house", "house", "house", "outbuilding", "house", "house", "house", "outbuilding", "house"]
gap = 2               # tiles between neighbouring lots
setback = 2           # tiles between the road and a lot's fence
yard = 2              # tiles of yard round a building, inside its fence

[dead]
# Which of creatures/*.toml they are, and each kind's share (they add up to 1).
kinds = [{ creature = "shambler", share = 0.9 }, { creature = "ghoul", share = 0.1 }]
per_chunk = 1.2       # in the open: the dead in an average chunk
per_house = [0, 2]    # inside each building: the fewest and the most
clear_start = 16      # none within this many tiles of where you start

[beasts]
# Wildlife (creatures/hushlands.toml), out in the open, clear of where you start as the dead are:
# deer in herds, wolves in packs (pack: the fewest and the most together). They aren't the dead:
# the pressure doesn't count them, the bell doesn't draw them.
kinds = [
  { creature = "deer", share = 0.8, pack = [1, 3] },
  { creature = "wolf", share = 0.2, pack = [2, 4] },
]
per_chunk = 0.2       # herds and packs in an average chunk

[pressure]
# The Long Dusk, here: how many of the dead the patch holds, in per cent of how many it began
# with. While it holds fewer, one walks in every so often, into a part of the patch away from you
# (so what you put down is made up for out of sight). Time raises it to the ceiling; each body
# that gets up raises it, past the ceiling if need be; each body burned lowers it.
start = 100
least = 25
most = 200
per_day = 5           # time's rise, a game day
ceiling = 150         # time raises it no higher (relighting the wardstone will lower this)
per_rise = 2          # each body that gets up
per_burn = 2          # each body burned
every = 30            # game minutes between the dead walking in, while the patch is short of them

[holdout]
# The abbey on the hill (prefabs/abbey.toml, holdouts.toml): north of the road where it starts,
# its gate on the road. You start just inside it; the hamlet is the road's start tiles east.
prefab = "abbey"

[rares]
# Rare monsters (affixes.toml): some of the region's dead, named, with one to three affixes and a
# pack of finds (loot/rares.toml). The abbey puts a bounty on each (holdouts.toml).
count = 3             # in a patch
affixes = [1, 2]      # each has this many, the fewest and the most
far = 40              # tiles from where you start, at the least
loot = "rare"         # what they carry

[tolling]
# The Tolling (CONCEPT.md): on set nights the old chapel's bell, which no one rings, tolls, and
# every dead thing within reach walks to it, by one shared way (crates/dusk-core/src/flow.rs),
# beating down shut doors on the way. That night they don't give up on what they go after: seen
# going into a house, you're besieged in it until dawn. Word comes at dawn on the day.
bell = "chapel"       # the prefab it hangs in: just inside its door
first = 3             # the first Tolling's game day
every = 5             # days from one to the next
hour = 22.0           # it begins at 22:00, and lasts until dawn
rings = 60            # game minutes the bell rings
toll_every = 2        # a toll every so many game minutes
loudness = 60         # tiles a toll carries: it wakes you, and it's heard across the hamlet
reach = 96            # tiles from the bell the dead are drawn from
door = 12.0           # a shut door is worth this many tiles of walking round to them

[weather]
# Rain (CONCEPT.md, the realm): it puts out lights held up outdoors, masks sound, washes blood
# away, and darkens the sky. Under a roof, none of it but the sky. It comes in spells, each dry,
# rain or heavy rain, from the seed and the clock.
spell = 4.0           # game hours a spell lasts
rain = 0.3            # the share of spells that are rain
heavy = 0.35          # of those, the share that's heavy
sound = [0.75, 0.5]   # how far a sound outdoors carries: in rain, in heavy rain
scent = [0.5, 0.2]    # how far blood outdoors is smelled
sky = [0.75, 0.55]    # the sky's light
douse = [0.02, 0.08]  # the chance a minute a light held up outdoors goes out

[river]
# A river north to south across the patch, beside the hamlet (east of it if there's room). Deep
# water nobody crosses, a tile of shallows at each bank, a bridge where the road meets it, and
# fords: rows shallow all the way across. Wading is slow and loud (rules.toml, [shallows]), so a
# ford is a gamble and the bridge a choke point, for you and for the dead.
width = 5             # tiles of deep water across
sway = 9              # the most it strays east or west of its line, in tiles
bend = 48.0           # tiles between its bends
fords = 2
margin = 6            # tiles it keeps clear of the hamlet's lots

[farms]
# Farmsteads out in the fields (prefabs/farm.toml): a farmhouse and its barn about a farmyard
# with a well, and a field of tall wheat that nobody sees through. Each faces the road, a track
# from its gate to it, wherever it keeps clear of the town, the abbey, the river and the others.
# Out here the dead are few, and there's water at the well: a place to make a home.
tag = "farm"
count = 3
off_road = [16, 48]   # tiles from the road to a farm's fence: the fewest and the most
gap = 10              # tiles a farm keeps clear of every other lot, and of the river

[barrows]
# Old burial mounds out in the wilds, each with a wight (prefabs/barrow.toml): placed as the farms
# are, off the road with an old track to it, clear of every lot and of the river.
tag = "barrow"
count = 2
off_road = [30, 70]   # tiles from the road: deeper in than the farms
gap = 12

[plants]
# Wild plants (fixtures.toml's forage), out in the wilds: each tile of open grass, of the woods'
# floor between the trees, or of a riverbank or a pond's shore has this chance of one (kinds on the
# same ground share its tiles, in this order). The yards round some places grow their own (a
# prefab's grows: the barrows' and the graveyard's feverfew).
kinds = [
  { plant = "yarrow", on = "open", chance = 0.003 },
  { plant = "bramble", on = "woods", chance = 0.006 },
  { plant = "chamomile", on = "water", chance = 0.06 },
]
