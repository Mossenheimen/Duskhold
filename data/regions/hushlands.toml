# The Hushlands: grey-green fields and woods, ponds, a road, and a hamlet where the dead walk.
# The generator (crates/dusk-gen) makes a patch of it from a seed.

id = "hushlands"
name = "The Hushlands"

[patch]
chunks = [8, 8]       # the patch's size, in chunks of 32 × 32 tiles

[terrain]
hill_size = 40.0      # tiles across a rise in the land, roughly
pond_below = 0.27     # the land's height (0 to 1) under which there's water
woods_from = 0.58     # the dampness (0 to 1) where the woods begin
woods_thick = 0.75    # the dampness where they're at their thickest
woods_trees = 0.6     # the share of tiles with a tree where they're thickest
field_trees = 0.008   # the share of open land with a lone tree

[road]
width = 3             # tiles
bend_every = 24       # tiles between bends
sway = 8              # the most a bend strays north or south of the middle, in tiles
start = 40            # you start on the road this many tiles west of the hamlet

[hamlet]
# The lots, by prefab tag, from the middle of the hamlet outward on alternate sides of the
# road: north, south, north, ...
lots = ["landmark", "house", "house", "outbuilding", "house", "house", "house", "outbuilding", "house", "house"]
gap = 2               # tiles between neighbouring lots
setback = 2           # tiles between the road and a lot's fence
yard = 2              # tiles of yard round a building, inside its fence

[dead]
# Which of creatures/*.toml they are, and each kind's share (they add up to 1).
kinds = [{ creature = "shambler", share = 0.9 }, { creature = "ghoul", share = 0.1 }]
per_chunk = 1.2       # in the open: the dead in an average chunk
per_house = [0, 2]    # inside each building: the fewest and the most
clear_start = 16      # none within this many tiles of where you start
