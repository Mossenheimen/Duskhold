# The Hushlands: grey-green fields and woods, ponds, a road, and a hamlet where the dead walk.
# The generator (crates/dusk-gen) makes a patch of it from a seed.

id = "hushlands"
name = "The Hushlands"

[patch]
chunks = [8, 8]       # the patch's size, in chunks of 32 × 32 tiles

[terrain]
hill_size = 40.0      # tiles across a rise in the land, roughly
pond_below = 0.27     # the land's height (0 to 1) under which there's water
woods_from = 0.58     # the dampness (0 to 1) where the woods begin
woods_thick = 0.75    # the dampness where they're at their thickest
woods_trees = 0.6     # the share of tiles with a tree where they're thickest
field_trees = 0.008   # the share of open land with a lone tree

[road]
width = 3             # tiles
bend_every = 24       # tiles between bends
sway = 8              # the most a bend strays north or south of the middle, in tiles
start = 40            # you start on the road this many tiles west of the hamlet

[hamlet]
# The lots, by prefab tag, from the middle of the hamlet outward on alternate sides of the
# road: north, south, north, ...
lots = ["landmark", "house", "house", "outbuilding", "house", "house", "house", "outbuilding", "house", "house"]
gap = 2               # tiles between neighbouring lots
setback = 2           # tiles between the road and a lot's fence
yard = 2              # tiles of yard round a building, inside its fence

[dead]
# Which of creatures/*.toml they are, and each kind's share (they add up to 1).
kinds = [{ creature = "shambler", share = 0.9 }, { creature = "ghoul", share = 0.1 }]
per_chunk = 1.2       # in the open: the dead in an average chunk
per_house = [0, 2]    # inside each building: the fewest and the most
clear_start = 16      # none within this many tiles of where you start

[pressure]
# The Long Dusk, here: how many of the dead the patch holds, in per cent of how many it began
# with. While it holds fewer, one walks in every so often, into a part of the patch away from you
# (so what you put down is made up for out of sight). Time raises it to the ceiling; each body
# that gets up raises it, past the ceiling if need be; each body burned lowers it.
start = 100
least = 25
most = 200
per_day = 5           # time's rise, a game day
ceiling = 150         # time raises it no higher (relighting the wardstone will lower this)
per_rise = 2          # each body that gets up
per_burn = 2          # each body burned
every = 30            # game minutes between the dead walking in, while the patch is short of them

[holdout]
# The abbey on the hill (prefabs/abbey.toml, holdouts.toml): north of the road where it starts,
# its gate on the road. You start just inside it; the hamlet is the road's start tiles east.
prefab = "abbey"

[rares]
# Rare monsters (affixes.toml): some of the region's dead, named, with one to three affixes and a
# pack of finds (loot/rares.toml). The abbey puts a bounty on each (holdouts.toml).
count = 3             # in a patch
affixes = [1, 2]      # each has this many, the fewest and the most
far = 40              # tiles from where you start, at the least
loot = "rare"         # what they carry

[tolling]
# The Tolling (CONCEPT.md): on set nights the old chapel's bell, which no one rings, tolls, and
# every dead thing within reach walks to it, by one shared way (crates/dusk-core/src/flow.rs),
# beating down shut doors on the way. That night they don't give up on what they go after: seen
# going into a house, you're besieged in it until dawn. Word comes at dawn on the day.
bell = "chapel"       # the prefab it hangs in: just inside its door
first = 3             # the first Tolling's game day
every = 5             # days from one to the next
hour = 22.0           # it begins at 22:00, and lasts until dawn
rings = 60            # game minutes the bell rings
toll_every = 2        # a toll every so many game minutes
loudness = 60         # tiles a toll carries: it wakes you, and it's heard across the hamlet
reach = 96            # tiles from the bell the dead are drawn from
door = 12.0           # a shut door is worth this many tiles of walking round to them
