# What a rare carries (regions/*.toml, [rares]): better than a cupboard's, and all of it finds.
# Its weapons, bows, shields and armour are always magic (properties.toml), and now and then one is
# one of the uniques made on it (uniques.toml). Put the rare down, and it falls where it does.

[[loot]]
id = "rare"
rolls = [2, 3]
level = 1             # its magic reaches a tier further than where it walks (properties.toml)
items = [
  { item = "coins", weight = 4, count = [10, 30] },
  { item = "tincture", weight = 2 },
  { item = "travellers_pack", weight = 1 },   # the best bag there is, only ever off a rare
  { item = "hand_axe", weight = 2, magic = 1.0, unique = 0.06 },
  { item = "wood_axe", weight = 2, magic = 1.0, unique = 0.06 },
  { item = "kitchen_knife", weight = 2, magic = 1.0, unique = 0.06 },
  { item = "leather_bracers", weight = 1, magic = 1.0, unique = 0.06 },
  { item = "iron_helm", weight = 1, magic = 1.0, unique = 0.06 },
  { item = "hunting_bow", weight = 1, magic = 1.0, unique = 0.06 },
  { item = "buckler", weight = 1, magic = 1.0, unique = 0.06 },
  { item = "lamp_oil", weight = 2, count = [1, 2] },
  { item = "bandage", weight = 2, count = [1, 3] },
  { item = "jerky", weight = 1, count = [2, 4] },
  { item = "life_potion", weight = 2, count = [1, 2] },   # items/potions.toml
  { item = "haste_potion", weight = 1 },
  { item = "iron_skin_potion", weight = 1 },
]
