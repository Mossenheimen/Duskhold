# What a rare carries (regions/*.toml, [rares]): better than a cupboard's, and all of it finds.
# Its weapons are always magic (properties.toml). Put the rare down, and it falls where it does.

[[loot]]
id = "rare"
rolls = [2, 3]
items = [
  { item = "coins", weight = 4, count = [10, 30] },
  { item = "tincture", weight = 2 },
  { item = "travellers_pack", weight = 1 },   # the best bag there is, only ever off a rare
  { item = "hand_axe", weight = 2, magic = 1.0 },
  { item = "wood_axe", weight = 2, magic = 1.0 },
  { item = "kitchen_knife", weight = 2, magic = 1.0 },
  { item = "lamp_oil", weight = 2, count = [1, 2] },
  { item = "bandage", weight = 2, count = [1, 3] },
  { item = "jerky", weight = 1, count = [2, 4] },
]
