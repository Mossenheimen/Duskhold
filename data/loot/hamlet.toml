# What the hamlet's containers hold. A table makes so many draws (rolls: the fewest and the
# most); each draw picks one line by its weight, and so many of it (count, 1 if not given).
# A fixture names its table in fixtures.toml. A container's contents come from the seed and its
# place: the same whenever it's opened, and nothing is stored until something is taken.

[[loot]]
id = "kitchen"        # cupboards
rolls = [1, 3]
items = [
  { item = "bread", weight = 4 },
  { item = "apple", weight = 4, count = [1, 4] },
  { item = "water", weight = 3 },
  { item = "kitchen_knife", weight = 2, magic = 0.1 },
  { item = "rag", weight = 2, count = [1, 2] },
  { item = "candle", weight = 1, count = [1, 3] },
  { item = "lamp_oil", weight = 2 },
]

