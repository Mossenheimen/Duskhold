# What the graveyard's tombs hold (prefabs/graveyard.toml): grave goods, read as hamlet.toml is.
# Worth the walk past its skeletons with a mace in hand: old coin, and old arms, more often magic
# than anything a house holds.

[[loot]]
id = "tomb"
rolls = [1, 2]
items = [
  { item = "coins", weight = 4, count = [5, 25] },
  { item = "candle", weight = 2, count = [1, 3] },
  { item = "sword", weight = 1, magic = 0.4 },
  { item = "mace", weight = 1, magic = 0.4 },
  { item = "spear", weight = 1, magic = 0.4 },
]
