# The Hushlands' dead. They hunt by sound first, and see a little.

[[creature]]
id = "shambler"
walk = 0.5            # tiles a second, shuffling about
run = 0.8             # lurching after something
night_speed = 1.25    # at night (the sky under half its light) it moves this much faster
sight = 8             # tiles, in full light: in less it sees less far (rules.toml, [sight])
darkvision = 1        # tiles it sees in any light
cone = 120            # degrees across: you can get behind one
think_every = 5       # ticks between thoughts (staggered, so they don't all think at once)
forget_after = 30.0   # seconds before it gives up on what it heard or saw
wander = 0.1          # the chance it shuffles a step when it thinks, if it's after nothing
path_budget = 400     # the most tiles it searches for a way: the dead aren't clever
health = 30           # points: three or four blows of a cudgel
down = 4.0            # seconds it stays down when knocked down
# It leans in and reaches for 1.2 s (its tell), then strikes. Its hits wound rather than doing
# damage of their own. The tell is long enough to answer three ways: shove it (0.2 s), hit it
# first (a cudgel's 0.4 s), or step back out of reach (0.7 s a tile, at the risk of a parting
# grab). At 0.8 s, stepping back left 0.1 s to react in: a tell nobody could use.
attack = { wind_up = 1.2, recovery = 0.6, hit = 0.5, noise = 3 }
# Catching sight of you, it groans, and the others within this many tiles come to it: how one
# becomes a crowd. One that was already after something doesn't, so they don't call for ever.
groan = 10
wounds = { scratch = 0.7, laceration = 0.25, bite = 0.05 }   # what a hit leaves
thump = [2, 4]        # what a blow does to a shut door in its way (rules.toml, [door])

# The reason to run (CONCEPT.md, the Hushlands' four): faster than your walk (1.5), slower than
# your run (3.0), even at night (2.5). You out-run one, while your breath lasts; you don't
# out-walk it. It makes no groan (it doesn't share), and it follows blood: with a wound bleeding
# it can't be lost, so bandage first, run second. Its wounds may carry ghoul fever.
[[creature]]
id = "ghoul"
walk = 0.8            # prowling
run = 2.0             # after you
night_speed = 1.25
sight = 10
darkvision = 3        # it hunts by night better than a shambler
cone = 140
think_every = 3       # quicker than the dead
forget_after = 45.0
wander = 0.15
path_budget = 800     # and cleverer: it finds the way round
health = 25           # a little frailer than a shambler: worth fighting, if it's alone
down = 3.0
# Its tell is shorter than a shambler's, but still a second to answer in.
attack = { wind_up = 1.0, recovery = 0.5, hit = 0.6, noise = 2 }
groan = 0
blood = 12            # tiles it smells blood from, for each wound that's bleeding (up to three)
wounds = { scratch = 0.5, laceration = 0.35, bite = 0.15 }
fever = { scratch = 0.05, laceration = 0.25, bite = 0.75 }   # the chance each carries ghoul fever
thump = [1, 2]        # it claws at a door rather than beating it down
