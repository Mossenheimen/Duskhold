# The Hushlands' dead. They hunt by sound first, and see a little.

[[creature]]
id = "shambler"
walk = 0.5            # tiles a second, shuffling about
run = 0.8             # lurching after something
night_speed = 1.25    # at night (the sky under half its light) it moves this much faster
sight = 8             # tiles, in full light: in less it sees less far (rules.toml, [sight])
darkvision = 1        # tiles it sees in any light
cone = 120            # degrees across: you can get behind one
think_every = 5       # ticks between thoughts (staggered, so they don't all think at once)
forget_after = 30.0   # seconds before it gives up on what it heard or saw
wander = 0.1          # the chance it shuffles a step when it thinks, if it's after nothing
path_budget = 400     # the most tiles it searches for a way: the dead aren't clever
health = 30           # points: three or four blows of a cudgel
down = 4.0            # seconds it stays down when knocked down
# It leans in and reaches for 1.2 s (its tell), then strikes. Its hits wound rather than doing
# damage of their own. The tell is long enough to answer three ways: shove it (0.2 s), hit it
# first (a cudgel's 0.4 s), or step back out of reach (0.7 s a tile, at the risk of a parting
# grab). At 0.8 s, stepping back left 0.1 s to react in: a tell nobody could use.
attack = { wind_up = 1.2, recovery = 0.6, hit = 0.5, noise = 3 }
# Catching sight of you, it groans, and the others within this many tiles come to it: how one
# becomes a crowd. One that was already after something doesn't, so they don't call for ever.
groan = 10
wounds = { scratch = 0.7, laceration = 0.25, bite = 0.05 }   # what a hit leaves
thump = [2, 4]        # what a blow does to a shut door in its way (rules.toml, [door])
# Put down, it gets up again half a day to a day and a half later, unless it's burned (rules.toml,
# [burning]). It gets up once: put down a second time, it stays down.
get_up = { chance = 1.0, after = [12.0, 36.0] }   # game hours after it fell

# The reason to run (CONCEPT.md, the Hushlands' four): faster than your walk (1.5), slower than
# your run (3.0), even at night (2.5). You out-run one, while your breath lasts; you don't
# out-walk it. It makes no groan (it doesn't share), and it follows blood: with a wound bleeding
# it can't be lost, so bandage first, run second. Its wounds may carry ghoul fever.
[[creature]]
id = "ghoul"
walk = 0.8            # prowling
run = 2.0             # after you
night_speed = 1.25
sight = 10
darkvision = 3        # it hunts by night better than a shambler
cone = 140
think_every = 3       # quicker than the dead
forget_after = 45.0
wander = 0.15
path_budget = 800     # and cleverer: it finds the way round
health = 25           # a little frailer than a shambler: worth fighting, if it's alone
down = 3.0
# Its tell is shorter than a shambler's, but still a second to answer in.
attack = { wind_up = 1.0, recovery = 0.5, hit = 0.6, noise = 2 }
groan = 0
blood = 12            # tiles it smells blood from, for each wound that's bleeding (up to three)
wounds = { scratch = 0.5, laceration = 0.35, bite = 0.15 }
fever = { scratch = 0.05, laceration = 0.25, bite = 0.75 }   # the chance each carries ghoul fever
thump = [1, 2]        # it claws at a door rather than beating it down
get_up = { chance = 1.0, after = [12.0, 36.0] }

# What your own body rises as (rules.toml, [revenant]), at midnight unless it was burned: you, in
# your gear, and worse. Twice a shambler's health, a quick hand, and faster than your walk, so
# you don't stroll away from it. It makes no groan and it doesn't wander: it haunts the place it
# fell. It never spawns in the region's mix (regions/*.toml), and put down, it stays down.
[[creature]]
id = "revenant"
walk = 0.6
run = 1.7             # faster than your walk (1.5), slower than your run (3.0)
night_speed = 1.25
sight = 10
darkvision = 2
cone = 140
think_every = 3
forget_after = 60.0
wander = 0.0          # it stays where it fell
path_budget = 800
health = 60           # twice a shambler
down = 2.0
attack = { wind_up = 1.0, recovery = 0.5, hit = 0.65, noise = 3 }
groan = 0
wounds = { scratch = 0.4, laceration = 0.45, bite = 0.15 }
thump = [3, 5]

# The graveyard's (prefabs/graveyard.toml): the town's old dead, bone and nothing else. A blade
# finds little to cut and a spear less to pierce, but a blunt weapon shatters them: the reason to
# carry a mace or a hammer. Lighter than a shambler and quicker, and they see in the dark better
# than any of the dead. No flesh: no bite, so no fever, and no breath to groan with. It never
# spawns in the region's mix (regions/*.toml), and shattered, it stays down.
[[creature]]
id = "skeleton"
walk = 0.6
run = 1.3             # quicker than a shambler (0.8), slower than your walk (1.5)
night_speed = 1.25
sight = 10
darkvision = 4        # empty sockets see in any light
cone = 140
think_every = 4
forget_after = 40.0
wander = 0.05         # it keeps to the graves
path_budget = 500
health = 24           # a mace's one or two blows, a sword's four to six
down = 2.0            # bones clatter back up quickly
attack = { wind_up = 1.1, recovery = 0.6, hit = 0.55, noise = 3 }   # a bony hand, or a rusted blade
groan = 0
wounds = { scratch = 0.55, laceration = 0.45, bite = 0.0 }
thump = [2, 3]
resist = { blade = 0.4, spear = 0.3, axe = 0.7, blunt = 1.5 }   # what it takes of a blow, by weapon

# The barrows' (prefabs/barrow.toml): the night's own. By day it lies still in its barrow, and the
# barrow's dim light is enough to weaken it: that's when to go in. After dark it walks, puts out
# every light near it (your torch, your fire), and its nearness alone frightens you (dread). Faster
# than your walk, slower than your run, and it sees far in the dark. In the light it takes twice
# the harm of a blow. Put down, it stays down. It never spawns in the region's mix.
[[creature]]
id = "wight"
walk = 0.7
run = 1.8
night_speed = 1.0     # it is the night's: no faster for it
sight = 12
darkvision = 6
cone = 160
think_every = 3
forget_after = 90.0
wander = 0.1
path_budget = 1000
health = 60           # twice a shambler
down = 1.5
attack = { wind_up = 0.9, recovery = 0.5, hit = 0.7, noise = 2 }   # cold claws
groan = 0
wounds = { scratch = 0.3, laceration = 0.6, bite = 0.1 }
thump = [3, 5]
nocturnal = true      # only after dark
douses = 4            # lights and fires within this many tiles go out
dread = 25            # points of dread it adds near you, over one of the dead's
lit_harm = 2.0        # what it takes of a blow in the light

# The Hushlands' wildlife (crates/dusk-core/src/hunting.rs): beasts that run from you and are
# after nobody. A deer outruns you (4.0 to your 3.0), sees far and nearly all round, and bolts
# from anyone it sees within flees tiles, from your footsteps (rules.toml: walk_noise 3), and from
# a blow or an arrow. Sneak up from behind, or shoot it from where it hasn't seen you: unaware,
# an arrow does a sneak attack's harm. Cut up with a knife or an axe, it gives raw venison.

[[creature]]
id = "deer"
walk = 1.0
run = 4.0
night_speed = 1.0     # the dark doesn't quicken it
sight = 12
darkvision = 2
cone = 300            # only straight behind it is it blind
think_every = 5
forget_after = 8.0    # seconds it runs after the last fright
wander = 0.04         # grazing: a step every few seconds
path_budget = 50
health = 12           # most arrows that land drop it (a hunting bow: 10 to 16); one unaware, always
down = 2.0
attack = { wind_up = 1.0, recovery = 1.0, hit = 0.0, noise = 0 }   # it never strikes
wounds = { scratch = 1.0, laceration = 0.0, bite = 0.0 }
thump = [0, 0]
flees = 9             # tiles: one of the living seen nearer than this, and it bolts
butcher = { item = "raw_venison", count = 3, time = 20.0 }   # seconds kneeling over it
