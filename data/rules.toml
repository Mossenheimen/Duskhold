# The world's rules, in a designer's units. dusk-data turns them into the core's (thousandths of
# a tile, ticks, cosines). Tests use the core's own fixed rules (Rules::default) instead.

[world]
active_radius = 3     # chunks round you that run in full; farther out, the world sleeps
repath_after = 2.0    # seconds held up before looking for another way

[sound]
# The loudness a sound loses through each kind of edge, in tiles. Fences and open doors cost
# nothing.
wall = 4
shut_door = 2
shut_window = 1

[character]
walk = 1.5            # tiles a second
run = 3.0
walk_noise = 3        # how far footsteps carry, in tiles
run_noise = 8
path_budget = 4096    # the most tiles one search for a way looks at
health = 100          # points
carry = 15.0          # kg you carry before you're weighed down: no running
wield = "cudgel"      # in hand at the start (items/*.toml)
kit = ["bandage", "torch"]   # and in the pack (name one twice for two)

[items]
# Seconds each item action takes. Like every timed action, a blow breaks it off.
take = 0.4            # to take a stack from a container or the floor...
per_kg = 0.1          # ...and this much more for each kg of it
drop = 0.2
wield = 0.5           # to take a weapon in hand
unwield = 0.3         # to put it away
light = 1.5           # to light a torch or a candle and hold it up in your other hand
douse = 0.5           # to put it out

[endurance]
# A bar of 100 points that pays for everything active. Empty, you're out of breath: no running,
# and slow, weak swings, until it's back to recover_at.
run = 4.0             # spent a second running
walk = 3.0            # got back a second walking
rest = 10.0           # got back a second standing still
recover_at = 30

[attack]
# Your swing with nothing in hand: fists. A weapon brings its own (items/weapons.toml). The
# wind-up is the tell the dead see.
wind_up = 0.3         # seconds
recovery = 0.4
endurance = 5
hit = 0.85            # the chance it lands (on one that's down, it always does)
damage = [2, 4]       # health, out of a shambler's 30; double on one that's down
noise = 3             # tiles: fists are as quiet as a knife, and stay in the room

[shove]
# No harm: it pushes back a tile, breaks off what they were doing, and sometimes knocks down.
wind_up = 0.2
recovery = 0.4
endurance = 6
knock_down = 0.4      # the chance it knocks down what it pushes
noise = 2

[door]
time = 0.5            # seconds to open or shut one
noise = 3
strength = 60         # what a door takes before it gives way: health points of beating
thump_noise = 8       # how far a blow on a door is heard, in tiles

[wounds]
# What each kind of wound costs: health at once, then seconds of bleeding (bandages come with
# items).
scratch = { damage = 8, bleed = 0.0 }
laceration = { damage = 15, bleed = 20.0 }
bite = { damage = 30, bleed = 40.0 }
bleeding = 0.5        # health a second for each wound that's bleeding

[grab]
# A shambler's hit can take hold of you, the likelier the more of them are on you. Held, you
# can't walk or swing, its blows always land, and you get no breath back: struggle (F) or shove
# (Q) it off. Three holding you at once, or a hold on you with no breath left, drag you down.
chance = 0.15         # a hit's chance to take hold
per_extra = 0.15      # more for each other one on you
tired = 0.2           # more when you're out of breath
parting = 0.25        # the chance one on you grabs you as you step out of its reach
bite = 0.35           # while it holds you, the share of its hits that are bites
drag_down = 3         # this many holding you at once drag you down
struggle = { wind_up = 0.5, recovery = 0.2, endurance = 12, hit = 0.7, noise = 3 }
struggle_per_extra = 0.2   # less chance for each other one holding you; half when out of breath

[clock]
rate = 24             # the clock runs this many times as fast as action time: a game day is an hour at 1×
start = 8.0           # the hour day 1 begins

# Needs, out of 100 (0 is fine). Each has three levels, and each level one clear effect.
[hunger]
rise = 6.0            # a game hour: eat two or three times a game day
levels = [30, 55, 85] # peckish, hungry, starving
recovery = 0.75       # hungry or worse: endurance comes back at this pace
harm = 2.0            # starving: health lost a game hour

[thirst]
rise = 8.0
levels = [30, 55, 85] # thirsty, parched, dying of thirst
recovery = 0.5
harm = 4.0

[fatigue]
rise = 4.0            # a game hour awake: sleep once a game day
rest = 12.5           # a game hour asleep beside a bed; on the ground, half that
levels = [45, 70, 90] # drowsy, tired, falling asleep (you can lie down from drowsy on)
slow = [1.25, 1.5]    # tired, falling asleep: wind-ups take this much longer

[sleep]
lie_down = 1.0        # seconds to lie down
needs = 0.5           # asleep, hunger and thirst rise at this pace
clear = 10            # no sleep with one of the dead after you within this many tiles
# Asleep, a blow, a grab or any noise that reaches you wakes you; so does being rested.

[healing]
health = 1.0          # health back a game hour, fed, watered and not bleeding
asleep = 3            # asleep, this many times as fast
scratch = 12.0        # game hours a wound takes to close, once it's stopped bleeding
laceration = 48.0
bite = 96.0

[water]
drink = 3.0           # seconds to drink your fill from water beside you (a pond, a stream)

[day]
# The sky's light, out of 100, from the clock: full by day, `night` after dark, rising from dawn
# and falling from sunset.
dawn = 5.0            # hours
sunrise = 7.0
sunset = 19.0
dark = 21.0
night = 10            # a moon and the stars: you make out 2 tiles, against about 6 by a torch.
                      # (At 20 a torch showed you 5 tiles for 4 without: all cost, no gain.)
indoors = 0.6         # under a roof, the share of the sky's light that's left

[sight]
# What you see: a cone ahead, and what's beside you all round, as far as the light lets you. A
# tile lit at 100 is seen out to `range`, one lit at 50 half as far. The dead's eyes work the
# same way (creatures/*.toml: sight, cone, darkvision).
range = 20            # tiles, in full light
cone = 160            # degrees across
beside = 1            # tiles all round that you see in any light

[skills]
# Skills grow by use, and only by real use under real risk: a blow that lands on one of the dead
# (with a weapon: fists teach nothing), a run with one of the dead after you or under a heavy
# load, a bandage on a wound that's bleeding. A swing at the air or a door, or a run with nothing
# after you, teaches nothing. The same act on the same foe, or in the same spot, pays less each
# time, so there's nothing to farm.
levels = [10, 30, 70, 150, 300, 550, 900, 1400, 2100, 3000]  # XP to reach levels 1 to 10
free_cap = 7          # every skill rises this far...
masteries = 3         # ...and this many go on to 10, each chosen once it's reached the cap
repeat = 0.75         # a repeat pays this share of what it paid the time before...
forget = 6.0          # ...until it's been left alone this many game hours
spot = 8              # tiles: running round in a square this size is running in the same spot
chased = 12           # tiles: one of the dead after you this near makes a run count...
loaded = 0.5          # ...or carrying more than this share of what you can

[skills.xp]
hit = 1.0             # a blow that lands: about 2.3 for a shambler felled in three
down = 0.5            # on one that's down, this share of it
run = 0.2             # a tile run under risk (Athletics)
bandage = 3.0         # a bandage on a wound that's bleeding (First Aid)
board = 2.0           # a board nailed across a door or window (Carpentry); the same one pays less
sneak = 0.3           # a tile sneaked with the dead near and none after you (Stealth)
sneak_attack = 3.0    # a sneak attack that lands (Stealth)
shield = 1.5          # a blow blocked, or a shove with a shield on your arm (Shield)
turn = 2.0            # each of the dead turned (Devotion); the same one pays less
mend = 3.0            # a bleeding wound mended with faith (Devotion)
pick = 1.0            # a wild plant picked (Foraging); picking in one spot pays less

[skills.level]
# What each level gives, as a share a level (level 5 gives five times this).
hit = 0.01            # weapon skills: the chance a blow lands, added (85% is 95% at 10)
damage = 0.05         # more harm a blow
endurance = 0.03      # less endurance a swing
wear = 0.05           # less wear on the weapon a blow
run_speed = 0.02      # Athletics: faster running...
run_endurance = 0.04  # ...for less endurance
bandage = 0.05        # First Aid: bandaging takes less time
board_time = 0.05     # Carpentry: boarding up takes less time...
board_strength = 0.1  # ...and the boards take more beating
sneak_pace = 0.03     # Stealth: quicker sneaking...
sneak_harm = 0.1      # ...and sneak attacks that do more harm
shield_block = 0.03   # Shield: a shield blocks this much more often
cook_time = 0.05      # Cooking: cooking takes less time
devotion_turn = 0.1   # Devotion: the dead stay turned longer...
devotion_cost = 0.04  # ...and faith goes further (28% further at the free cap)
forage_more = 0.1     # Foraging: a tenth likelier, a level, to find one more of a herb

[deeds]
# Most of a character's XP comes from what it brings home (CONCEPT.md, pillar 5). Home is where
# you last slept the night through (woke rested); your stash is one container under a roof near
# it. A find (anything that came out of the world's containers) put into your stash pays its
# worth (items/*.toml) once, and is an ordinary item from then on. You start at level 1.
levels = [30, 80, 160, 300, 500, 800, 1200, 1800, 2600]  # XP to reach levels 2 to 10
health = 5            # points a level brings: level 10 has 145, not 100. Tougher, never safe.
stash = 1.0           # seconds to mark a container as your stash
home = 8              # tiles from where you sleep that your stash may be

[fever]
# Ghoul fever, from a ghoul's wound (creatures/*.toml, fever): a fever on the first day, weakness
# on the second, and on the third you die of it. The cure (items/supplies.toml) works at any
# stage.
stage = 24.0          # game hours each stage lasts
thirst = 1.5          # feverish: thirst rises this many times as fast, and nothing heals
recovery = 0.5        # weak: your breath comes back at this pace
harm = 4.0            # dying: health points it costs a game hour, until the day's end kills you

[burning]
# The Hushlands' dead get up again (creatures/*.toml, get_up), unless they're burned: oil from your
# pack (items/supplies.toml), poured on, and set alight from the light you hold up. Fire goes from
# a burning body to the bodies on the tiles round it, a tile a game minute, so a pile at a door
# burns from one flask. A burning body lights the dark round it.
time = 3.0            # seconds to pour the oil on and set it alight
burn = 20             # game minutes a body burns, then it's ash
light = 4             # tiles a burning body lights round it (a torch's 5, a candle's 2)

[fire]
# A fire for your base: a hearth, a stove or a forge takes one (fixtures.toml's fire: how far it
# lights). Tending it (H) puts a piece of fuel on, the longest-burning first (items/*.toml's
# fuel), or, once it's laid, lights it from the light you hold up (L). It burns down a game
# minute at a time; putting it out (J) leaves what's left in it. A lit room needs no torch in
# your hand. But light is bait: at night the dead that see a fire, through a window or a door
# left open, come to it. Board the windows up before you light it.
most = 8.0            # game hours of fuel a fire holds: a night's worth
lay = 2.0             # seconds to put a piece on
light = 3.0           # seconds to light it
smother = 2.0         # seconds to put it out

[pain]
# Pain comes from wounds: what a fresh one of each kind hurts (points out of 100), less once it's
# dressed (a bandage on it, bleeding or not), and less the nearer it is to closing ([healing]).
# In pain, everything you do costs more breath; in agony, more again, and you can't sleep.
scratch = 10
laceration = 20
bite = 30
dressed = 0.5         # the share a dressed wound still hurts
levels = [10, 30, 60] # sore, in pain, agony
cost = [1.25, 1.5]    # in pain, in agony: what endurance costs come to

[dread]
# Dread, out of 100, moves each game minute toward what the moment is worth: the dark, the dead
# near you, your pain and your hunger. It rises fast and falls slowly; asleep, or on hallowed
# ground, it ebbs away. Uneasy, your aim shakes; afraid, more; frightened, most, and you can't
# make yourself step nearer the dead. A light takes the dark's share away: a torch steadies you.
dark = 30             # with your tile lit below dark_below (out of 100): alone in the dark, uneasy
dark_below = 25
per_dead = 20         # each of the dead within `near` tiles that you see, or that's after something,
near = 8
most = 3              # up to this many
per_pain = 10         # each level of pain
hungry = 10           # each level of hunger past peckish
rise = 6.0            # points a game minute up toward it,
fall = 1.0            # and down from it
calm = 3.0            # asleep or on hallowed ground: down to nothing at this pace
levels = [25, 50, 75] # uneasy, afraid, frightened
aim = [0.9, 0.8, 0.7] # what's left of your chance to hit at each

[crafting]
# Breaking furniture down (fixtures.toml's planks): a table, a chair, a bed, a pew, with any of
# these to hand. It's loud from the first blow to the last, and Carpentry learns from it and
# makes it quicker. What you can make is in recipes.toml.
plank = "plank"
tools = ["hammer", "hand_axe", "wood_axe"]
time = 8.0            # seconds
noise = 14           # tiles it's heard, as the work starts and as it's done
xp = 1.0             # Carpentry's

[sneak]
# Sneaking (Ctrl): a stance, not an action. No running, a slower step, footsteps that carry a
# fraction as far, and the dead see you only a fraction as far off (right beside them, or in
# their darkvision, as ever). A blow on one of the dead that's after nothing, from outside its
# sight cone, is a sneak attack, sneaking or not: it lands, and does many times the harm.
pace = 0.5            # of your walking pace (Stealth quickens it: [skills.level])
noise = 0.4           # of your footsteps' reach
seen = 0.5            # of how far off the dead see you
harm = 3.0            # a sneak attack's harm, times a blow's
near = 8              # tiles: a sneaked tile teaches Stealth with the dead this near

[shield]
# A shield (items/weapons.toml) is carried on the off arm, where a light would be. Holding Alt you
# brace behind it: slower, no running, and a blow from ahead may be blocked (no wound, no hold), for
# breath and wear. A shove with a shield on your arm is a bash: it knocks down more often.
pace = 0.6            # what's left of your pace, bracing

[armour]
# Armour (items/armour.toml) is worn, a piece to a place on the body. A blow on a covered place may
# glance off, by the piece's chance: no wound, no bleeding, no fever, but still a bruise. A blow on
# one that's down, or one struck unawares, finds the gaps.
bruise = 0.5          # what a blow that glances still does, of its harm
worn_weight = 0.5     # what a piece weighs worn, of what it would in the pack
off = 0.5             # taking a piece off takes this much of the time putting it on does
# How much of a piece's chance holds against a weapon's blow on the dead in armour (a wight's mail,
# your revenant in yours), by its kind: points go through mail, and blades skid off it.
pierce = { blade = 1.0, blunt = 0.6, axe = 0.8, spear = 0.4 }

[climb]
# Walking straight into an open window or a fence climbs it: a step, only slower, whatever your
# pace, its seconds costing breath as running does. Shut windows open with the door key (E); a
# boarded one can't be climbed. The dead climb too, by their kind's `climb` (creatures/), but only
# after something.
window = 1.6          # seconds through an open window
fence = 1.0           # seconds over a fence...
vault = 0.6           # ...and running at one, you vault it in this share of the time
noise = 4             # tiles: the scrape of a climb
heavy = 2.0           # weighed down, a climb takes this many times as long

[injury]
# Wounds by where they land: what each does to the living (the dead feel nothing). A part's hurt
# is the pain of the wounds on it ([pain]: by kind, half dressed, less as they heal), the arms
# counted with the hands and the legs with the feet; at each of two levels:
levels = [10, 25]     # hurt (a laceration), badly hurt (a bite)
swing = [1.15, 1.3]   # arms: a swing takes this much longer, wind-up and recovery,
arm_hit = [0.9, 0.8]  # and this much of its chance to land is left
pace = [0.85, 0.6]    # legs: this much of your pace is left (badly hurt, a ghoul outruns you),
run = [1.25, 1.5]     # and running costs this much more breath
head_hit = [0.9, 0.8] # head: what's left of your chance to land,
sight = [0.85, 0.7]   # and of how far you see
torso = 1.5           # a wound to the body hurts this much more

[shallows]
# Wading (a river's banks and fords, regions/*.toml [river]): slow going for everyone, the dead
# too, and a splash carries farther than a footstep. You can drink from it.
pace = 0.5            # how fast you wade, of a step's pace
noise = 1.5           # how far a splash carries, of a footstep's

[magic]
# Magic items (properties.toml): few, and each an event. Found unknown: it works, but you don't
# know what it does until a holdout reads it (holdouts.toml, identify), you've struck enough blows
# with it on the dead, or, for a light, you've lit it.
rare = 0.3            # of the magic items, the share that's Rare (two properties) not Uncommon (one)
cursed = 0.2          # the chance one is cursed as well
worth = [20, 50]      # the XP it adds to its kind's worth: Uncommon, Rare
learn = 15            # blows on the dead with an unknown weapon before you know what it is

[revenant]
# Your own death (CONCEPT.md, death and legacy): your body stays where it fell, in your gear, and
# unburned, the night after it rises as a revenant (creatures/*.toml), with your name and
# everything you carried. Put it down, and the gear falls where it falls. Burn the body first
# (rules.toml, [burning]), and it never rises; the gear falls where it lay.
creature = "revenant"
hour = 0.0            # it rises at midnight

[barricade]
# Board up a shut door or a window: a plank and nails for each board, with a hammer in hand or in
# the pack. A boarded door can't be opened; a boarded window can't be seen through. The dead's
# blows break the boards first, the last nailed first, then the door. Hammering is loud: board up
# by day. Prying a board off gives you the plank back; the nails are bent.
plank = "plank"
nails = "nails"
nails_each = 2
hammers = ["hammer"]
most = 4              # boards on one door or window
strength = 50         # what a board takes before it breaks (a door takes 60)
time = 4.0            # seconds to nail one on...
noise = 12            # ...heard this far, in tiles, as you start and as you finish
remove = 3.0          # seconds to pry one off
remove_noise = 6

[faith]
# The Cleric's (classes.toml: faith, turns; talents.toml). Faith, in points (a Cleric holds 100),
# is spent on what's below, and comes back only by prayer at a shrine (fixtures.toml's shrine: an
# altar): the abbey's, or the old chapel's in the heart of town. Anyone may pray, for comfort.
# The dead you turn flee from you for a while (creatures/*.toml: turned, a kind's share of it),
# let go of you and strike nobody; a blow ends it. A body consecrated, with holy water
# (items/supplies.toml) or with a cleric's faith, never gets up, as a body burned doesn't, and
# nothing burns: it's quiet, and makes no light.
pray = 10.0           # seconds kneeling at a shrine (P): faith full again
comfort = 20          # points of dread a prayer takes away, for anyone
turn = 30             # faith to turn the dead (U)
turn_time = 1.0       # seconds holding up the holy symbol: the tell
turn_recovery = 0.5
reach = 8             # tiles: the dead within it that you see are turned
turned = 20.0         # seconds they flee from you
noise = 6             # tiles the holy word carries: the turning is heard
consecrate = 15       # faith to consecrate a body (O) with no holy water
consecrate_time = 3.0 # seconds, with holy water or with faith
mend = 20             # Mending (M): its faith,
mend_health = 15      # the health it gives back,
mend_time = 2.0       # and seconds
ward = 40             # Warding (O, at a shut door): its faith,
ward_time = 4.0       # seconds,
ward_hours = 8.0      # and the game hours the ward holds: a night's worth

[foraging]
# Wild plants (fixtures.toml's forage; crates/dusk-core/src/forage.rs): picking the one beside you
# (Y), and what it is once it's picked bare, till it grows back.
pick = 3.0            # seconds bent over it
bare = "picked_plant"
