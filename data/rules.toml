# The world's rules, in a designer's units. dusk-data turns them into the core's (thousandths of
# a tile, ticks, cosines). Tests use the core's own fixed rules (Rules::default) instead.

[world]
active_radius = 3     # chunks round you that run in full; farther out, the world sleeps
repath_after = 2.0    # seconds held up before looking for another way

[sound]
# The loudness a sound loses through each kind of edge, in tiles. Fences and open doors cost
# nothing.
wall = 4
shut_door = 2
shut_window = 1

[character]
walk = 1.5            # tiles a second
run = 3.0
walk_noise = 3        # how far footsteps carry, in tiles
run_noise = 8
path_budget = 4096    # the most tiles one search for a way looks at
health = 100          # points
carry = 15.0          # kg you carry before you're weighed down: no running
wield = "cudgel"      # in hand at the start (items/*.toml)
kit = ["bandage", "torch"]   # and in the pack (name one twice for two)

[items]
# Seconds each item action takes. Like every timed action, a blow breaks it off.
take = 0.4            # to take a stack from a container or the floor...
per_kg = 0.1          # ...and this much more for each kg of it
drop = 0.2
wield = 0.5           # to take a weapon in hand
unwield = 0.3         # to put it away
light = 1.5           # to light a torch or a candle and hold it up in your other hand
douse = 0.5           # to put it out

[endurance]
# A bar of 100 points that pays for everything active. Empty, you're out of breath: no running,
# and slow, weak swings, until it's back to recover_at.
run = 4.0             # spent a second running
walk = 3.0            # got back a second walking
rest = 10.0           # got back a second standing still
recover_at = 30

[attack]
# Your swing with nothing in hand: fists. A weapon brings its own (items/weapons.toml). The
# wind-up is the tell the dead see.
wind_up = 0.3         # seconds
recovery = 0.4
endurance = 5
hit = 0.85            # the chance it lands (on one that's down, it always does)
damage = [2, 4]       # health, out of a shambler's 30; double on one that's down
noise = 2             # tiles

[shove]
# No harm: it pushes back a tile, breaks off what they were doing, and sometimes knocks down.
wind_up = 0.2
recovery = 0.4
endurance = 6
knock_down = 0.4      # the chance it knocks down what it pushes
noise = 2

[door]
time = 0.5            # seconds to open or shut one
noise = 3
strength = 60         # what a door takes before it gives way: health points of beating
thump_noise = 8       # how far a blow on a door is heard, in tiles

[wounds]
# What each kind of wound costs: health at once, then seconds of bleeding (bandages come with
# items).
scratch = { damage = 8, bleed = 0.0 }
laceration = { damage = 15, bleed = 20.0 }
bite = { damage = 30, bleed = 40.0 }
bleeding = 0.5        # health a second for each wound that's bleeding

[grab]
# A shambler's hit can take hold of you, the likelier the more of them are on you. Held, you
# can't walk or swing, its blows always land, and you get no breath back: struggle (F) or shove
# (Q) it off. Three holding you at once, or a hold on you with no breath left, drag you down.
chance = 0.15         # a hit's chance to take hold
per_extra = 0.15      # more for each other one on you
tired = 0.2           # more when you're out of breath
parting = 0.25        # the chance one on you grabs you as you step out of its reach
bite = 0.35           # while it holds you, the share of its hits that are bites
drag_down = 3         # this many holding you at once drag you down
struggle = { wind_up = 0.5, recovery = 0.2, endurance = 12, hit = 0.7, noise = 3 }
struggle_per_extra = 0.2   # less chance for each other one holding you; half when out of breath

[clock]
rate = 24             # the clock runs this many times as fast as action time: a game day is an hour at 1×
start = 8.0           # the hour day 1 begins

# Needs, out of 100 (0 is fine). Each has three levels, and each level one clear effect.
[hunger]
rise = 6.0            # a game hour: eat two or three times a game day
levels = [30, 55, 85] # peckish, hungry, starving
recovery = 0.75       # hungry or worse: endurance comes back at this pace
harm = 2.0            # starving: health lost a game hour

[thirst]
rise = 8.0
levels = [30, 55, 85] # thirsty, parched, dying of thirst
recovery = 0.5
harm = 4.0

[fatigue]
rise = 4.0            # a game hour awake: sleep once a game day
rest = 12.5           # a game hour asleep beside a bed; on the ground, half that
levels = [45, 70, 90] # drowsy, tired, falling asleep (you can lie down from drowsy on)
slow = [1.25, 1.5]    # tired, falling asleep: wind-ups take this much longer

[sleep]
lie_down = 1.0        # seconds to lie down
needs = 0.5           # asleep, hunger and thirst rise at this pace
clear = 10            # no sleep with one of the dead after you within this many tiles
# Asleep, a blow, a grab or any noise that reaches you wakes you; so does being rested.

[healing]
health = 1.0          # health back a game hour, fed, watered and not bleeding
asleep = 3            # asleep, this many times as fast
scratch = 12.0        # game hours a wound takes to close, once it's stopped bleeding
laceration = 48.0
bite = 96.0

[water]
drink = 3.0           # seconds to drink your fill from water beside you (a pond, a stream)

[day]
# The sky's light, out of 100, from the clock: full by day, `night` after dark, rising from dawn
# and falling from sunset.
dawn = 5.0            # hours
sunrise = 7.0
sunset = 19.0
dark = 21.0
night = 20            # a moon and the stars
indoors = 0.6         # under a roof, the share of the sky's light that's left

[sight]
# What you see: a cone ahead, and what's beside you all round, as far as the light lets you. A
# tile lit at 100 is seen out to `range`, one lit at 50 half as far. The dead's eyes work the
# same way (creatures/*.toml: sight, cone, darkvision).
range = 20            # tiles, in full light
cone = 160            # degrees across
beside = 1            # tiles all round that you see in any light
