<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Duskhold, a well: a cell or a slot sunk into the ground, shadowed at its top and left, lit at its foot; nine pieces, its corners 12 units (VISUALS.md §11; drawn by art.gd). -->
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0.85"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity="0.85"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
  </defs>
  <rect x="0" y="0" width="48" height="48" fill="#0d0b09"/>
  <rect x="1" y="1" width="46" height="8" fill="url(#top)"/>
  <rect x="1" y="1" width="8" height="46" fill="url(#left)"/>
  <rect x="1" y="46" width="46" height="1" fill="#e0c493" fill-opacity="0.12"/>
  <rect x="46" y="1" width="1" height="46" fill="#e0c493" fill-opacity="0.12"/>
  <rect x="0.5" y="0.5" width="47" height="47" fill="none" stroke="#3d2e1b" stroke-width="1"/>
</svg>
